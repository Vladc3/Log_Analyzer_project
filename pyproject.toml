[project]
name = "log-analyzer"
version = "0.1.0"
description = "Small CLI that finds ERROR/WARNING/CRITICAL lines in plain or gzipped log files."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
